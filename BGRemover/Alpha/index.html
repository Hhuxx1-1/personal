<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color to Alpha Converter (Batch Processing)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Add JSZip library for creating zip files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .transparency-grid {
            background-color: #f0f0f0;
            background-image: 
                linear-gradient(45deg, #ccc 25%, transparent 25%), 
                linear-gradient(-45deg, #ccc 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #ccc 75%), 
                linear-gradient(-45deg, transparent 75%, #ccc 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        #canvas {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 p-4 sm:p-8 flex items-center justify-center">

    <div class="bg-white rounded-xl shadow-xl w-full max-w-4xl p-6 sm:p-10 flex flex-col gap-6">
        <header class="text-center">
            <h1 class="text-3xl font-extrabold text-gray-900 mb-2">Color to Alpha (Batch)</h1>
            <p class="text-gray-500">Remove black or white backgrounds to create transparent PNGs. Upload multiple files at once to download a ZIP.</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Controls Section -->
            <div class="md:col-span-1 flex flex-col gap-5">
                
                <!-- Upload Button -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-gray-700 text-sm">1. Select Images</label>
                    <label for="imageUpload" class="cursor-pointer bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-600 font-medium py-3 px-4 rounded-lg text-center transition flex items-center justify-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                        </svg>
                        Upload Images
                    </label>
                    <!-- Added 'multiple' attribute here -->
                    <input type="file" id="imageUpload" class="hidden" accept="image/png, image/jpeg, image/webp" multiple />
                </div>

                <!-- Color Selection -->
                <div class="flex flex-col gap-2">
                    <label class="font-semibold text-gray-700 text-sm">2. Target Color</label>
                    <div class="flex flex-col gap-2">
                        <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
                            <input type="radio" name="colorMode" value="black" class="form-radio text-blue-600 w-4 h-4" checked>
                            <span class="text-sm font-medium">Black to Alpha</span>
                        </label>
                        <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-gray-50 transition">
                            <input type="radio" name="colorMode" value="white" class="form-radio text-blue-600 w-4 h-4">
                            <span class="text-sm font-medium">White to Alpha</span>
                        </label>
                    </div>
                </div>

                <!-- Download Button -->
                <div class="flex flex-col gap-2 mt-auto">
                    <label class="font-semibold text-gray-700 text-sm">3. Export</label>
                    <button id="downloadBtn" class="bg-gray-300 text-gray-500 font-semibold py-3 px-4 rounded-lg cursor-not-allowed transition flex items-center justify-center gap-2" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                        <span id="downloadBtnText">Download ZIP</span>
                    </button>
                </div>
            </div>

            <!-- Canvas/Preview Section -->
            <div class="md:col-span-2 flex flex-col relative min-h-[300px] border-2 border-dashed border-gray-300 rounded-xl overflow-hidden bg-gray-50">
                <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-gray-400 z-10 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span>Preview (First Image)</span>
                </div>
                
                <div id="canvasContainer" class="transparency-grid w-full h-full flex items-center justify-center p-4 hidden">
                    <canvas id="canvas"></canvas>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        const imageUpload = document.getElementById('imageUpload');
        const colorModes = document.querySelectorAll('input[name="colorMode"]');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadBtnText = document.getElementById('downloadBtnText');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('placeholder');
        const canvasContainer = document.getElementById('canvasContainer');

        let uploadedFiles = [];
        let previewImg = null;

        // Handle Image Upload (Batch)
        imageUpload.addEventListener('change', (e) => {
            uploadedFiles = Array.from(e.target.files);
            if (uploadedFiles.length === 0) return;

            // Load just the first image to preview it in the UI
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    previewImg = img;
                    
                    // Show canvas, hide placeholder
                    placeholder.classList.add('hidden');
                    canvasContainer.classList.remove('hidden');
                    
                    // Enable download button and update text
                    downloadBtn.disabled = false;
                    downloadBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed');
                    downloadBtn.classList.add('bg-blue-600', 'text-white', 'hover:bg-blue-700', 'cursor-pointer');
                    downloadBtnText.innerText = `Download ZIP (${uploadedFiles.length})`;

                    updatePreview();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(uploadedFiles[0]);
        });

        // Handle Mode Switch
        colorModes.forEach(radio => {
            radio.addEventListener('change', () => {
                if (previewImg) {
                    updatePreview();
                }
            });
        });

        // Handle Batch Download
        downloadBtn.addEventListener('click', async () => {
            if (uploadedFiles.length === 0) return;
            
            // Set UI to loading state
            downloadBtn.disabled = true;
            const originalText = downloadBtnText.innerText;
            downloadBtnText.innerText = "Processing...";
            downloadBtn.classList.add('opacity-75', 'cursor-wait');

            const zip = new JSZip();
            const mode = document.querySelector('input[name="colorMode"]:checked').value;

            // Process each file
            for (const file of uploadedFiles) {
                const img = await loadImage(file);
                const dataURL = processToDataURL(img, mode);
                
                // Strip the "data:image/png;base64," header
                const base64Data = dataURL.split(',')[1];
                
                // Keep original name but change extension to .png
                const newName = file.name.replace(/\.[^/.]+$/, "") + "_alpha.png";
                zip.file(newName, base64Data, {base64: true});
            }

            // Generate the zip and trigger download
            const zipContent = await zip.generateAsync({type: "blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(zipContent);
            link.download = "processed_images.zip";
            link.click();
            URL.revokeObjectURL(link.href);

            // Restore UI
            downloadBtn.disabled = false;
            downloadBtnText.innerText = originalText;
            downloadBtn.classList.remove('opacity-75', 'cursor-wait');
        });

        // Helper: Convert File to Image Object
        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Helper: Process an image off-screen and return base64 Data URL
        function processToDataURL(img, mode) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = img.width;
            offCanvas.height = img.height;
            const offCtx = offCanvas.getContext('2d');
            offCtx.drawImage(img, 0, 0);

            const imageData = offCtx.getImageData(0, 0, offCanvas.width, offCanvas.height);
            applyColorToAlpha(imageData, mode);
            offCtx.putImageData(imageData, 0, 0);

            return offCanvas.toDataURL('image/png');
        }

        // Helper: Updates the visual UI preview for the first image
        function updatePreview() {
            if (!previewImg) return;
            canvas.width = previewImg.width;
            canvas.height = previewImg.height;
            ctx.drawImage(previewImg, 0, 0);

            const mode = document.querySelector('input[name="colorMode"]:checked').value;
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            applyColorToAlpha(imageData, mode);
            ctx.putImageData(imageData, 0, 0);
        }

        // Core Algorithm: Shared pixel manipulation logic
        function applyColorToAlpha(imageData, mode) {
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                let r = data[i], g = data[i + 1], b = data[i + 2], a = data[i + 3];
                let new_alpha = 0;

                if (mode === 'black') {
                    new_alpha = Math.max(r, g, b);
                    if (new_alpha > 0) {
                        r = Math.min(255, (r * 255) / new_alpha);
                        g = Math.min(255, (g * 255) / new_alpha);
                        b = Math.min(255, (b * 255) / new_alpha);
                    } else {
                        r = 0; g = 0; b = 0;
                    }
                } else if (mode === 'white') {
                    new_alpha = 255 - Math.min(r, g, b);
                    if (new_alpha > 0) {
                        r = Math.max(0, 255 - ((255 - r) * 255) / new_alpha);
                        g = Math.max(0, 255 - ((255 - g) * 255) / new_alpha);
                        b = Math.max(0, 255 - ((255 - b) * 255) / new_alpha);
                    } else {
                        r = 255; g = 255; b = 255;
                    }
                }

                data[i] = r;
                data[i + 1] = g;
                data[i + 2] = b;
                data[i + 3] = (new_alpha * a) / 255;
            }
        }
    </script>
</body>
</html>
