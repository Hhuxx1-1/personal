<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color-Click Background Remover</title>
  <style>
    :root {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --text-main: #18181b;
      --border-color: #e4e4e7;
      --accent: #3b82f6;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 900px;
      width: 100%;
      display: grid;
      gap: 20px;
    }

    .header h1 { margin: 0 0 8px 0; font-size: 1.5rem; }
    .header p { margin: 0; color: #71717a; font-size: 0.95rem; }

    .toolbar {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-grow: 1;
      min-width: 150px;
    }

    label { font-weight: 600; font-size: 0.85rem; }
    
    input[type="file"] {
      font-size: 0.9rem;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    /* Updated to handle scrolling/zooming */
    .canvas-container {
      width: 100%;
      height: 500px; /* Fixed height to create a scrollable area */
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      background-color: #fff;
      overflow: auto; /* Adds scrollbars when canvas is zoomed */
      position: relative;
    }

    /* Wrapper ensures the canvas stays centered and checkerboard covers it */
    .canvas-wrapper {
      min-width: 100%;
      min-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      background-image: 
        linear-gradient(45deg, #ccc 25%, transparent 25%), 
        linear-gradient(135deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(135deg, transparent 75%, #ccc 75%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 0, 10px -10px, 0px 10px;
    }

    canvas {
      display: block;
      cursor: crosshair;
      box-shadow: 0 0 10px rgba(0,0,0,0.2); /* Helps see canvas edges */
      /* Width and height are controlled via JavaScript for zooming */
    }

    .placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #71717a;
      pointer-events: none;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      flex: 1;
      white-space: nowrap;
    }

    button:hover:not(:disabled) { background-color: #2563eb; }
    button.secondary { background-color: #e4e4e7; color: var(--text-main); }
    button.secondary:hover:not(:disabled) { background-color: #d4d4d8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Magic Background Eraser</h1>
      <p>Upload an image, zoom in for precision, and click the background to erase it.</p>
    </div>

    <div class="toolbar">
      <div class="control-group">
        <label for="imageUpload">1. Upload Image</label>
        <input type="file" id="imageUpload" accept="image/*">
      </div>
      
      <div class="control-group">
        <label for="tolerance">2. Tolerance: <span id="tolValue">30</span></label>
        <input type="range" id="tolerance" min="0" max="150" value="30">
      </div>

      <!-- New Zoom Slider -->
      <div class="control-group">
        <label for="zoom">3. Zoom: <span id="zoomValue">100%</span></label>
        <input type="range" id="zoom" min="10" max="500" value="100">
      </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <div class="placeholder" id="placeholder">Upload an image to start</div>
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="editorCanvas"></canvas>
      </div>
    </div>

    <div class="actions">
      <!-- New Undo Button -->
      <button class="secondary" id="undoBtn" onclick="undoStep()" disabled>Undo Last</button>
      <button class="secondary" onclick="resetImage()">Reset All</button>
      <button onclick="downloadPNG()">Download PNG</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const upload = document.getElementById('imageUpload');
    
    // UI Elements
    const toleranceSlider = document.getElementById('tolerance');
    const tolValue = document.getElementById('tolValue');
    const zoomSlider = document.getElementById('zoom');
    const zoomValue = document.getElementById('zoomValue');
    const placeholder = document.getElementById('placeholder');
    const undoBtn = document.getElementById('undoBtn');
    const canvasContainer = document.getElementById('canvasContainer');
    
    let originalImage = null;
    let baseScale = 1; // Determines initial fit
    
    // History Array for Undo
    const history = [];
    const maxHistory = 10; // Maximum number of undo steps to save memory

    // 1. Handle Image Upload
    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          // Set internal canvas resolution
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          
          originalImage = img;
          placeholder.style.display = 'none';

          // Clear history on new image
          history.length = 0;
          undoBtn.disabled = true;

          // Calculate initial scale to fit the container nicely
          const padding = 40;
          const scaleX = (canvasContainer.clientWidth - padding) / img.width;
          const scaleY = (canvasContainer.clientHeight - padding) / img.height;
          
          baseScale = Math.min(scaleX, scaleY);
          if (baseScale > 1) baseScale = 1; // Don't upscale tiny images on load

          // Reset Zoom UI
          zoomSlider.value = 100;
          zoomValue.textContent = '100%';
          applyZoom();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Handle UI Updates
    toleranceSlider.addEventListener('input', (e) => {
      tolValue.textContent = e.target.value;
    });

    zoomSlider.addEventListener('input', (e) => {
      zoomValue.textContent = e.target.value + '%';
      applyZoom();
    });

    // 2. Zooming Logic
    function applyZoom() {
      if (!originalImage) return;
      const zoomFactor = parseInt(zoomSlider.value) / 100;
      const currentScale = baseScale * zoomFactor;
      
      // Update canvas CSS size (enables native scrollbars in parent)
      canvas.style.width = `${canvas.width * currentScale}px`;
      canvas.style.height = `${canvas.height * currentScale}px`;
    }

    // 3. History & Undo Logic
    function saveState() {
      // Save current pixels before modifying
      history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      if (history.length > maxHistory) {
        history.shift(); // Remove oldest state to free memory
      }
      undoBtn.disabled = false;
    }

    function undoStep() {
      if (history.length > 0) {
        const previousState = history.pop();
        ctx.putImageData(previousState, 0, 0);
        if (history.length === 0) {
          undoBtn.disabled = true;
        }
      }
    }

    function resetImage() {
      if (originalImage) {
        saveState(); // Allow undoing the reset!
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImage, 0, 0);
      }
    }

    // 4. The Click Event (Get Coordinates)
    canvas.addEventListener('click', (e) => {
      if (!originalImage) return;

      // Accurately map mouse click to internal canvas pixels despite zoom
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      const startX = Math.floor((e.clientX - rect.left) * scaleX);
      const startY = Math.floor((e.clientY - rect.top) * scaleY);

      const tolerance = parseInt(toleranceSlider.value);
      
      floodFill(startX, startY, tolerance);
    });

    // 5. The Flood Fill Algorithm
    function floodFill(startX, startY, tolerance) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      const startIndex = (startY * width + startX) * 4;
      const targetR = data[startIndex];
      const targetG = data[startIndex + 1];
      const targetB = data[startIndex + 2];
      const targetA = data[startIndex + 3];

      // Ignore if clicking already transparent area
      if (targetA === 0) return;

      // Save history ONLY because we are about to make a change
      saveState();

      function colorMatch(index) {
        const r = data[index];
        const g = data[index + 1];
        const b = data[index + 2];
        const a = data[index + 3];

        if (a === 0) return false;

        const distance = Math.sqrt(
          Math.pow(r - targetR, 2) + 
          Math.pow(g - targetG, 2) + 
          Math.pow(b - targetB, 2)
        );

        return distance <= tolerance;
      }

      const pixelStack = [[startX, startY]];

      while (pixelStack.length > 0) {
        const [x, y] = pixelStack.pop();
        let currentX = x;
        let currentY = y;
        
        let pixelPos = (currentY * width + currentX) * 4;
        while (currentY >= 0 && colorMatch(pixelPos)) {
          currentY--;
          pixelPos -= width * 4;
        }

        currentY++;
        pixelPos += width * 4;

        let reachLeft = false;
        let reachRight = false;

        while (currentY < height && colorMatch(pixelPos)) {
          data[pixelPos + 3] = 0; // Turn transparent

          if (currentX > 0) {
            if (colorMatch(pixelPos - 4)) {
              if (!reachLeft) {
                pixelStack.push([currentX - 1, currentY]);
                reachLeft = true;
              }
            } else if (reachLeft) {
              reachLeft = false;
            }
          }

          if (currentX < width - 1) {
            if (colorMatch(pixelPos + 4)) {
              if (!reachRight) {
                pixelStack.push([currentX + 1, currentY]);
                reachRight = true;
              }
            } else if (reachRight) {
              reachRight = false;
            }
          }

          currentY++;
          pixelPos += width * 4;
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    // 6. Download Logic
    function downloadPNG() {
      if (!originalImage) return alert('Please upload an image first.');
      const link = document.createElement('a');
      link.download = `magic-cutout-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
