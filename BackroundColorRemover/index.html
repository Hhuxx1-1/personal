<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color-Click Background Remover</title>
  <style>
    :root {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --text-main: #18181b;
      --border-color: #e4e4e7;
      --accent: #3b82f6;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 800px;
      width: 100%;
      display: grid;
      gap: 20px;
    }

    .header h1 { margin: 0 0 8px 0; font-size: 1.5rem; }
    .header p { margin: 0; color: #71717a; font-size: 0.95rem; }

    .toolbar {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      background: #f8fafc;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-grow: 1;
    }

    label { font-weight: 600; font-size: 0.85rem; }
    
    input[type="file"] {
      font-size: 0.9rem;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    /* Checkerboard container to show transparency */
    .canvas-container {
      width: 100%;
      min-height: 400px;
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      background-image: 
        linear-gradient(45deg, #ccc 25%, transparent 25%), 
        linear-gradient(135deg, #ccc 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #ccc 75%),
        linear-gradient(135deg, transparent 75%, #ccc 75%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 0, 10px -10px, 0px 10px;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      cursor: crosshair; /* Indicates clicking to pick color */
    }

    canvas {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      display: block;
    }

    .placeholder {
      position: absolute;
      color: #71717a;
      pointer-events: none;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      flex: 1;
    }

    button:hover { background-color: #2563eb; }
    button.secondary { background-color: #e4e4e7; color: var(--text-main); }
    button.secondary:hover { background-color: #d4d4d8; }

  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Magic Background Eraser</h1>
      <p>Upload an image, then click on the solid background to erase it.</p>
    </div>

    <div class="toolbar">
      <div class="control-group">
        <label for="imageUpload">1. Upload Image</label>
        <input type="file" id="imageUpload" accept="image/*">
      </div>
      
      <div class="control-group">
        <label for="tolerance">2. Color Tolerance: <span id="tolValue">30</span></label>
        <input type="range" id="tolerance" min="0" max="150" value="30">
      </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <div class="placeholder" id="placeholder">Upload an image to start</div>
      <canvas id="editorCanvas"></canvas>
    </div>

    <div class="actions">
      <button class="secondary" onclick="resetImage()">Undo All</button>
      <button onclick="downloadPNG()">Download Transparent PNG</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');
    const upload = document.getElementById('imageUpload');
    const toleranceSlider = document.getElementById('tolerance');
    const tolValue = document.getElementById('tolValue');
    const placeholder = document.getElementById('placeholder');
    
    let originalImage = null; // Keeps a copy of the untouched image for resets

    // 1. Handle Image Upload
    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          // Set canvas dimensions to match the actual image resolution
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          originalImage = img; // Save state
          placeholder.style.display = 'none';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // Update tolerance label
    toleranceSlider.addEventListener('input', (e) => {
      tolValue.textContent = e.target.value;
    });

    // Restore the original image
    function resetImage() {
      if (originalImage) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImage, 0, 0);
      }
    }

    // 2. The Click Event (Get Coordinates)
    canvas.addEventListener('click', (e) => {
      if (!originalImage) return;

      // Calculate actual canvas coordinates (handling CSS scaling)
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      const startX = Math.floor((e.clientX - rect.left) * scaleX);
      const startY = Math.floor((e.clientY - rect.top) * scaleY);

      const tolerance = parseInt(toleranceSlider.value);
      
      // Run the magic wand
      floodFill(startX, startY, tolerance);
    });

    // 3. The Flood Fill Algorithm (Magic Wand)
    function floodFill(startX, startY, tolerance) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      // Find the color the user clicked on
      const startIndex = (startY * width + startX) * 4;
      const targetR = data[startIndex];
      const targetG = data[startIndex + 1];
      const targetB = data[startIndex + 2];
      const targetA = data[startIndex + 3];

      // If they clicked an already transparent area, ignore
      if (targetA === 0) return;

      // Helper function to check if a pixel is within the color tolerance
      function colorMatch(index) {
        const r = data[index];
        const g = data[index + 1];
        const b = data[index + 2];
        const a = data[index + 3];

        if (a === 0) return false; // Already transparent

        // Euclidean distance for color difference
        const distance = Math.sqrt(
          Math.pow(r - targetR, 2) + 
          Math.pow(g - targetG, 2) + 
          Math.pow(b - targetB, 2)
        );

        return distance <= tolerance;
      }

      // Stack-based algorithm (prevents stack overflow on large images)
      const pixelStack = [[startX, startY]];

      while (pixelStack.length > 0) {
        const [x, y] = pixelStack.pop();
        let currentX = x;
        let currentY = y;
        
        // Move up as far as colors match
        let pixelPos = (currentY * width + currentX) * 4;
        while (currentY >= 0 && colorMatch(pixelPos)) {
          currentY--;
          pixelPos -= width * 4;
        }

        currentY++; // Move back down one pixel to the first valid match
        pixelPos += width * 4;

        let reachLeft = false;
        let reachRight = false;

        // Move down, turning matching pixels transparent
        while (currentY < height && colorMatch(pixelPos)) {
          // Turn pixel transparent (Set Alpha to 0)
          data[pixelPos + 3] = 0;

          if (currentX > 0) {
            if (colorMatch(pixelPos - 4)) {
              if (!reachLeft) {
                pixelStack.push([currentX - 1, currentY]);
                reachLeft = true;
              }
            } else if (reachLeft) {
              reachLeft = false;
            }
          }

          if (currentX < width - 1) {
            if (colorMatch(pixelPos + 4)) {
              if (!reachRight) {
                pixelStack.push([currentX + 1, currentY]);
                reachRight = true;
              }
            } else if (reachRight) {
              reachRight = false;
            }
          }

          currentY++;
          pixelPos += width * 4;
        }
      }

      // Apply the modified pixel data back to the canvas
      ctx.putImageData(imgData, 0, 0);
    }

    // 4. Download Logic
    function downloadPNG() {
      if (!originalImage) return alert('Please upload an image first.');
      const link = document.createElement('a');
      link.download = `magic-cutout-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
