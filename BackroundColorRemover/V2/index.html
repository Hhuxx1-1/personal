<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color-Click Background Remover</title>
  <style>
    /* 1. Theme Variables setup for Light & Dark Mode */
    :root {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --text-main: #18181b;
      --text-muted: #71717a;
      --border-color: #e4e4e7;
      --accent: #3b82f6;
      --toolbar-bg: #f8fafc;
      --checker-dark: #ccc;
    }

    [data-theme="dark"] {
      --bg-color: #09090b;
      --card-bg: #18181b;
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --border-color: #27272a;
      --toolbar-bg: #27272a;
      --checker-dark: #3f3f46;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      max-width: 900px;
      width: 100%;
      display: grid;
      gap: 20px;
      transition: background-color 0.3s;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-text h1 { margin: 0 0 8px 0; font-size: 1.5rem; }
    .header-text p { margin: 0; color: var(--text-muted); font-size: 0.95rem; }

    .instructions {
      background-color: var(--toolbar-bg);
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
    .instructions h4 { margin: 0 0 5px 0; }
    .instructions ul { margin: 0; padding-left: 20px; color: var(--text-muted); }
    .instructions li { margin-bottom: 4px; }

    .toolbar {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--toolbar-bg);
      padding: 15px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex-grow: 1;
      min-width: 150px;
    }

    label { font-weight: 600; font-size: 0.85rem; }
    
    input[type="file"] { font-size: 0.9rem; color: var(--text-main); }
    input[type="range"] { width: 100%; cursor: pointer; }

    .canvas-container {
      width: 100%;
      height: 500px; 
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      background-color: var(--card-bg);
      overflow: auto; 
      position: relative;
    }

    /* Checkboard dynamically responds to dark mode */
    .canvas-wrapper {
      min-width: 100%;
      min-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
      background-image: 
        linear-gradient(45deg, var(--checker-dark) 25%, transparent 25%), 
        linear-gradient(135deg, var(--checker-dark) 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, var(--checker-dark) 75%),
        linear-gradient(135deg, transparent 75%, var(--checker-dark) 75%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 0, 10px -10px, 0px 10px;
    }

    canvas {
      display: block;
      cursor: crosshair;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .placeholder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-muted);
      pointer-events: none;
      font-weight: 500;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      flex: 1;
      white-space: nowrap;
    }

    button:hover:not(:disabled) { background-color: #2563eb; }
    
    button.secondary { 
      background-color: var(--toolbar-bg); 
      color: var(--text-main); 
      border: 1px solid var(--border-color);
    }
    button.secondary:hover:not(:disabled) { background-color: var(--border-color); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="header-text">
        <h1>Magic Background Eraser</h1>
        <p>Click on solid backgrounds to easily make them transparent.</p>
      </div>
      <button class="secondary" id="themeToggle" style="flex: 0; padding: 8px 15px;">🌙 Dark Mode</button>
    </div>

    <div class="instructions">
      <h4>How to edit:</h4>
      <ul>
        <li><strong>Left Click</strong> on the canvas to erase the clicked color.</li>
        <li><strong>Mouse Scroll Wheel</strong> to zoom in and out.</li>
        <li><strong>Right-Click & Hold</strong> (or Middle-Click & Hold) to pan around the image.</li>
      </ul>
    </div>

    <div class="toolbar">
      <div class="control-group">
        <label for="imageUpload">1. Upload Image</label>
        <input type="file" id="imageUpload" accept="image/*">
      </div>
      
      <div class="control-group">
        <label for="tolerance">2. Tolerance: <span id="tolValue">30</span></label>
        <input type="range" id="tolerance" min="0" max="150" value="30">
      </div>

      <div class="control-group">
        <label for="zoom">3. Zoom: <span id="zoomValue">100%</span></label>
        <input type="range" id="zoom" min="10" max="500" value="100">
      </div>
    </div>

    <div class="canvas-container" id="canvasContainer">
      <div class="placeholder" id="placeholder">Upload an image to start</div>
      <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="editorCanvas"></canvas>
      </div>
    </div>

    <div class="actions">
      <button class="secondary" id="undoBtn" onclick="undoStep()" disabled>Undo Last</button>
      <button class="secondary" onclick="resetImage()">Reset All</button>
      <button onclick="downloadPNG()">Download PNG</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const upload = document.getElementById('imageUpload');
    
    // UI Elements
    const toleranceSlider = document.getElementById('tolerance');
    const tolValue = document.getElementById('tolValue');
    const zoomSlider = document.getElementById('zoom');
    const zoomValue = document.getElementById('zoomValue');
    const placeholder = document.getElementById('placeholder');
    const undoBtn = document.getElementById('undoBtn');
    const canvasContainer = document.getElementById('canvasContainer');
    const themeToggle = document.getElementById('themeToggle');
    
    let originalImage = null;
    let baseScale = 1; 
    
    // History Array for Undo
    const history = [];
    const maxHistory = 10; 

    // --- 1. Theme Toggle ---
    themeToggle.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        themeToggle.textContent = '🌙 Dark Mode';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        themeToggle.textContent = '☀️ Light Mode';
      }
    });

    // --- 2. Image Upload ---
    upload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        const img = new Image();
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0);
          
          originalImage = img;
          placeholder.style.display = 'none';

          history.length = 0;
          undoBtn.disabled = true;

          const padding = 40;
          const scaleX = (canvasContainer.clientWidth - padding) / img.width;
          const scaleY = (canvasContainer.clientHeight - padding) / img.height;
          
          baseScale = Math.min(scaleX, scaleY);
          if (baseScale > 1) baseScale = 1; 

          zoomSlider.value = 100;
          zoomValue.textContent = '100%';
          applyZoom();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    // --- 3. UI Update Listeners ---
    toleranceSlider.addEventListener('input', (e) => tolValue.textContent = e.target.value);
    zoomSlider.addEventListener('input', (e) => {
      zoomValue.textContent = e.target.value + '%';
      applyZoom();
    });

    function applyZoom() {
      if (!originalImage) return;
      const zoomFactor = parseInt(zoomSlider.value) / 100;
      const currentScale = baseScale * zoomFactor;
      
      canvas.style.width = `${canvas.width * currentScale}px`;
      canvas.style.height = `${canvas.height * currentScale}px`;
    }

    // --- 4. Interactive Zooming (Mouse Wheel) ---
    canvasContainer.addEventListener('wheel', (e) => {
      if (!originalImage) return;
      e.preventDefault(); 

      const zoomStep = 10;
      let currentZoom = parseInt(zoomSlider.value);

      // Track mouse position relative to container
      const rect = canvasContainer.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      // Track relative scroll ratio before resize
      const scrollRatioX = (canvasContainer.scrollLeft + mouseX) / canvasContainer.scrollWidth;
      const scrollRatioY = (canvasContainer.scrollTop + mouseY) / canvasContainer.scrollHeight;

      // Determine zoom direction
      if (e.deltaY < 0) { // Scroll up -> Zoom In
        currentZoom = Math.min(parseInt(zoomSlider.max), currentZoom + zoomStep);
      } else { // Scroll down -> Zoom Out
        currentZoom = Math.max(parseInt(zoomSlider.min), currentZoom - zoomStep);
      }

      zoomSlider.value = currentZoom;
      zoomValue.textContent = currentZoom + '%';
      applyZoom();

      // Adjust scrollbars instantly to keep mouse focused on the same spot
      canvasContainer.scrollLeft = (scrollRatioX * canvasContainer.scrollWidth) - mouseX;
      canvasContainer.scrollTop = (scrollRatioY * canvasContainer.scrollHeight) - mouseY;
    }, { passive: false });


    // --- 5. Panning (Right Click / Middle Click Drag) ---
    let isDragging = false;
    let startX, startY, startScrollLeft, startScrollTop;

    // Prevent default context menu on right click inside the container
    canvasContainer.addEventListener('contextmenu', e => e.preventDefault());

    canvasContainer.addEventListener('mousedown', (e) => {
      if (e.button === 1 || e.button === 2) { // Middle or Right click
        isDragging = true;
        canvasContainer.style.cursor = 'grabbing';
        startX = e.pageX - canvasContainer.offsetLeft;
        startY = e.pageY - canvasContainer.offsetTop;
        startScrollLeft = canvasContainer.scrollLeft;
        startScrollTop = canvasContainer.scrollTop;
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (isDragging && (e.button === 1 || e.button === 2)) {
        isDragging = false;
        canvasContainer.style.cursor = 'default';
      }
    });

    canvasContainer.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      e.preventDefault();
      const x = e.pageX - canvasContainer.offsetLeft;
      const y = e.pageY - canvasContainer.offsetTop;
      const walkX = x - startX;
      const walkY = y - startY;
      canvasContainer.scrollLeft = startScrollLeft - walkX;
      canvasContainer.scrollTop = startScrollTop - walkY;
    });


    // --- 6. State Management (Undo) ---
    function saveState() {
      history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      if (history.length > maxHistory) history.shift();
      undoBtn.disabled = false;
    }

    function undoStep() {
      if (history.length > 0) {
        const previousState = history.pop();
        ctx.putImageData(previousState, 0, 0);
        if (history.length === 0) undoBtn.disabled = true;
      }
    }

    function resetImage() {
      if (originalImage) {
        saveState(); 
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(originalImage, 0, 0);
      }
    }


    // --- 7. Eraser Magic Wand (Flood Fill) ---
    canvas.addEventListener('click', (e) => {
      if (!originalImage || e.button !== 0) return; // Only trigger on Left Click

      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      
      const startX = Math.floor((e.clientX - rect.left) * scaleX);
      const startY = Math.floor((e.clientY - rect.top) * scaleY);
      const tolerance = parseInt(toleranceSlider.value);
      
      floodFill(startX, startY, tolerance);
    });

    function floodFill(startX, startY, tolerance) {
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;
      const width = canvas.width;
      const height = canvas.height;

      const startIndex = (startY * width + startX) * 4;
      const targetR = data[startIndex];
      const targetG = data[startIndex + 1];
      const targetB = data[startIndex + 2];
      const targetA = data[startIndex + 3];

      if (targetA === 0) return; // Skip if already erased

      saveState(); // Snapshot before erasing

      function colorMatch(index) {
        const r = data[index];
        const g = data[index + 1];
        const b = data[index + 2];
        const a = data[index + 3];

        if (a === 0) return false;

        const distance = Math.sqrt(
          Math.pow(r - targetR, 2) + 
          Math.pow(g - targetG, 2) + 
          Math.pow(b - targetB, 2)
        );
        return distance <= tolerance;
      }

      const pixelStack = [[startX, startY]];

      while (pixelStack.length > 0) {
        const [x, y] = pixelStack.pop();
        let currentX = x;
        let currentY = y;
        
        let pixelPos = (currentY * width + currentX) * 4;
        while (currentY >= 0 && colorMatch(pixelPos)) {
          currentY--;
          pixelPos -= width * 4;
        }

        currentY++;
        pixelPos += width * 4;

        let reachLeft = false;
        let reachRight = false;

        while (currentY < height && colorMatch(pixelPos)) {
          data[pixelPos + 3] = 0; // Erase alpha channel

          if (currentX > 0) {
            if (colorMatch(pixelPos - 4)) {
              if (!reachLeft) {
                pixelStack.push([currentX - 1, currentY]);
                reachLeft = true;
              }
            } else if (reachLeft) {
              reachLeft = false;
            }
          }

          if (currentX < width - 1) {
            if (colorMatch(pixelPos + 4)) {
              if (!reachRight) {
                pixelStack.push([currentX + 1, currentY]);
                reachRight = true;
              }
            } else if (reachRight) {
              reachRight = false;
            }
          }

          currentY++;
          pixelPos += width * 4;
        }
      }
      ctx.putImageData(imgData, 0, 0);
    }

    // --- 8. Downloading ---
    function downloadPNG() {
      if (!originalImage) return alert('Please upload an image first.');
      const link = document.createElement('a');
      link.download = `magic-cutout-${Date.now()}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
